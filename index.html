rchases||{})[id]!==true)return;s.positions=s.positions||{};const defaults={window:{x:22,y:35},rug:{x:50,y:75},books:{x:80,y:37},plant:{x:82,y:75}};const p=s.positions[id]||defaults[id];const d=b.dataset.move;const x=Math.max(12,Math.min(88,p.x+(d==='left'?-7:d==='right'?7:0))),y=Math.max(15,Math.min(85,p.y+(d==='up'?-7:d==='down'?7:0)));s.positions[id]={x,y};save();render();return}if(b.dataset.event){const x=forestEvents.find(z=>z.id===b.dataset.event);if(!x)return;s.eventsDone=s.eventsDone||{};if(s.eventsDone[x.id])return;if(!Object.entries(x.need).every(([id,n])=>count(id)>=n)){toast('材料还不够，先去采集吧');return}Object.entries(x.need).forEach(([id,n])=>s.inv[id]-=n);s.eventsDone[x.id]=true;addXP(5);addJournal('帮助了'+x.title+'，获得森林伙伴的感谢。');s.forestDialogues=s.forestDialogues||{};s.forestDialogues[x.id]=2;activeForestStory=x.id;s.stars=(s.stars||0)+x.reward;save();render();magicForestCelebration(x.icon,x.reward);return}if(b.dataset.buy){const x=shopItems.find(i=>i.id===b.dataset.buy);if(!x)return;s.purchases=s.purchases||{};if(s.purchases[x.id])return;if((s.stars||0)<x.price){toast('星光不够，先完成任务吧');return}s.stars-=x.price;s.purchases[x.id]=true;save();render();toast('✨ 已购买：'+x.name);return}if(b.dataset.claim){const x=achievements.find(i=>i.id===b.dataset.claim);if(!x||!x.done())return;s.claimed=s.claimed||{};if(s.claimed[x.id])return;s.claimed[x.id]=true;s.stars=(s.stars||0)+3;save();render();toast('🏅 成就达成！星光 ＋3');return}if(b.dataset.pick){const id=b.dataset.pick;s.inv[id]=(s.inv[id]||0)+1;s.gathers++;addXP(1);if(s.gathers%5===0)addJournal('在月光森林里完成了第 '+s.gathers+' 次采集。');save();render();toast('采集成功：'+items[id].name+' ＋1');return}if(b.dataset.use){if(s.made[b.dataset.use])magic(b.dataset.use);return}if(b.dataset.make){const r=recipes.find(x=>x.id===b.dataset.make);if(!r)return;if(!Object.entries(r.need).every(([id,n])=>count(id)>=n)){toast('材料不足');return}Object.entries(r.need).forEach(([id,n])=>s.inv[id]-=n);s.made[r.id]=(s.made[r.id]||0)+1;s.crafts++;addXP(3);addJournal('成功制作了「'+r.name+'」，魔法工坊又多了一份奇迹。');save();render();brewVisual(r);return}if(a==='dailyReward'){const d=dailyState();if(d.claimed||(s.gathers||0)-d.gatherBase<3||(s.crafts||0)-d.craftBase<1)return;d.claimed=true;s.stars=(s.stars||0)+3;addXP(5);addJournal('完成今日小小委托，获得3颗星光。');save();render();toast('🌙 今日委托完成！⭐3 · 经验+5')}else if(a==='start')start();else if(a==='continue'){close();goto('grove');toast('继续你的森林旅程！')}else if(a==='guide')guide();else if(a==='visitor')goto('visitor');else if(a==='serve'){if(!firstMade()){toast('先制作一杯安眠茶');return}s.visitorDone=true;s.stars=(s.stars||0)+2;save();render();toast('🐈‍⬛ 墨墨很开心！星光 ＋2')}else if(a==='chapter3'){if(!s.chapter2||Object.values(s.eventsDone||{}).filter(Boolean).length<3||s.chapter3)return;s.chapter3=true;s.stars=(s.stars||0)+10;save();render();toast('🌠 第三章完成！星光 ＋10')}else if(a==='chapter2'){const n=Object.values(s.made).filter(Boolean).length;if(!s.questReward||n<4||!Object.values(s.purchases||{}).some(Boolean)||s.chapter2)return;s.chapter2=true;s.stars=(s.stars||0)+8;save();render();toast('🌟 第二章完成！星光 ＋8')}else if(a==='reward'){if(questStep()!==3||s.questReward)return;s.questReward=true;s.stars=(s.stars||0)+5;save();render();toast('🌟 第一章完成！星光 ＋5')}else if(a==='close')close();else if(a==='guideNext'){s.guide=(s.guide||0)+1;if(s.guide>2){s.guide=0;save();close();goto('grove');toast('引导完成！先采集材料吧')}else{save();guide()}}else if(a==='reset'){s={inv:{dew:0,mush:0,flower:0,leaf:0},made:{},gathers:0,crafts:0,guide:0,stars:0,visitorDone:false,questReward:false,used:{},purchases:{},chapter2:false,claimed:{},eventsDone:{},chapter3:false,positions:{},forestDialogues:{},forestChoices:{},xp:0,daily:{},journal:[]};save();close();goto('grove');toast('新游戏开始！先采集材料吧')}});render();})();
