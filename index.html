-width="6"/><ellipse cx="281" cy="208" rx="34" ry="11" fill="#d5a7d1"/><g fill="#fff1bf"><circle cx="280" cy="173" r="5"/><circle cx="269" cy="188" r="4"/><circle cx="294" cy="184" r="3"/></g><path d="M370 184v-51" stroke="#e2c49c" stroke-width="5"/><path d="M359 135h22l-5-23h-13z" fill="#ffde98"/></svg><span class="artIcon spark">🧙🏻‍♀️</span></div><h2>🪄 魔法制作台</h2><p class="small">材料足够时，点击「开始制作」，新作品会加入收藏。</p><div class="cards">'+recipes.map(r=>{const ok=Object.entries(r.need).every(([id,n])=>count(id)>=n);return '<div class="item"><span class="emoji">'+r.emoji+'</span><b>'+r.name+'</b><p>'+Object.entries(r.need).map(([id,n])=>items[id].name+' ×'+n).join('<br>')+'</p><button data-make="'+r.id+'" '+(ok?'':'disabled')+'>'+(ok?'✨ 开始制作':'材料不足')+'</button></div>'}).join('')+'</div></section>'}else if(page==='visitor'){h='<section class="panel"><div class="sceneArt"><svg class="paint" viewBox="0 0 420 310" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bcraft" x2="0" y2="1"><stop stop-color="#493452"/><stop offset="1" stop-color="#9a7194"/></linearGradient></defs><path fill="url(#bcraft)" d="M0 0h420v310H0z"/><circle cx="330" cy="59" r="31" fill="#ffedc2"/><circle cx="330" cy="59" r="60" fill="#ffe9b1" opacity=".13"/><path d="M0 210 210 112 420 210v100H0" fill="#73536e"/><path d="M0 0h420v68L210 135 0 68z" fill="#382e51"/><path d="M0 245h420v65H0z" fill="#5c465b"/><rect x="44" y="116" width="110" height="124" rx="8" fill="#a77e7e" stroke="#d7b7a0" stroke-width="5"/><rect x="60" y="134" width="76" height="85" rx="6" fill="#f6d7a2"/><path d="M98 134v85M60 175h76" stroke="#74546d" stroke-width="8"/><path d="M190 228h190v24H190z" fill="#c49a82"/><path d="M207 250h16v60h-16zm137 0h16v60h-16z" fill="#72516a"/><ellipse cx="281" cy="216" rx="54" ry="17" fill="#3e364e"/><path d="M236 211q-12-61 44-66 57 4 45 66" fill="#765d87" stroke="#e8bbab" stroke-width="6"/><ellipse cx="281" cy="208" rx="34" ry="11" fill="#d5a7d1"/><g fill="#ff 魔法。','下一步：学习采集'],['🌿 第一步：采集材料','进入「采集」，分别点击两次月光露珠、一次铃兰花。材料会自动放进背包。','下一步：学习制作'],['🪄 第二步：制作魔法','进入「制作」，选择「月光安眠茶」，点击开始制作。完成后可以去「收藏」查看作品。','完成引导']];const i=Math.min(s.guide||0,2),a=steps[i];modal(a[0],a[1],'<button class="main" data-act="guideNext">'+a[2]+'</button><button class="second" data-act="close">稍后再说</button>')}function start(){modal('✨ 开始一段新旅程？','开始新游戏会清空本试玩版在当前浏览器的采集与制作进度。','<button class="main" data-act="reset">确认开始新游戏</button><button class="second" data-act="close">保留原有进度</button>')}document.addEventListener('click',function(e){const b=e.target.closest('button');if(!b)return;const a=b.dataset.act;if(b.dataset.page){goto(b.dataset.page);return}if(b.dataset.pick){const id=b.dataset.pick;s.inv[id]=(s.inv[id]||0)+1;s.gathers++;save();render();toast('采集成功：'+items[id].name+' ＋1');return}if(b.dataset.use){if(s.made[b.dataset.use])magic(b.dataset.use);return}if(b.dataset.make){const r=recipes.find(x=>x.id===b.dataset.make);if(!r)return;if(!Object.entries(r.need).every(([id,n])=>count(id)>=n)){toast('材料不足');return}Object.entries(r.need).forEach(([id,n])=>s.inv[id]-=n);s.made[r.id]=(s.made[r.id]||0)+1;s.crafts++;save();render();toast('✨ 制作成功：'+r.name);return}if(a==='start')start();else if(a==='continue'){close();goto('grove');toast('继续你的森林旅程！')}else if(a==='guide')guide();else if(a==='visitor')goto('visitor');else if(a==='serve'){if(!firstMade()){toast('先制作一杯安眠茶');return}s.visitorDone=true;s.stars=(s.stars||0)+2;save();render();toast('🐈‍⬛ 墨墨很开心！星光 ＋2')}else if(a==='reward'){if(questStep()!==3||s.questReward)return;s.questReward=true;s.stars=(s.stars||0)+5;save();render();toast('🌟 第一章完成！星光 ＋5')}else if(a==='close')close();else if(a==='guideNext'){s.guide=(s.guide||0)+1;if(s.guide>2){s.guide=0;save();close();goto('grove');toast('引导完成！先采集材料吧')}else{save();guide()}}else if(a==='reset'){s={inv:{dew:0,mush:0,flower:0,leaf:0},made:{},gathers:0,crafts:0,guide:0,stars:0,visitorDone:false,questReward:false,used:{}};save();close();goto('grove');toast('新游戏开始！先采集材料吧')}});render(
